<!-- Main avatar circle: shows the resolved image (finalSrc) or the initials fallback; size driven by sizePixels/fontSizePixels -->
<div class="avatar-container">
  <div
    class="avatar"
    [class.avatar--clickable]="!editable"
    [style.width.px]="sizePixels"
    [style.height.px]="sizePixels"
    [style.fontSize.px]="fontSizePixels"
    (click)="openModal($event)"
    [attr.role]="editable ? null : 'button'"
    [attr.tabindex]="editable ? -1 : 0">

    <!-- Shows the profile image when finalSrc resolves to a URL, otherwise falls back to initials -->
    @if (finalSrc) {
      <img [src]="finalSrc" [alt]="'Avatar de ' + displayName" class="avatar__image" />
    } @else {
      <span class="avatar__initials">{{ initials }}</span>
    }
  </div>

  <!-- Edit overlay: only rendered when the `editable` input is true, offering upload and delete actions -->
  @if (editable) {
    <div class="avatar-edit-overlay">
      <input
        #fileInput
        type="file"
        accept="image/*"
        (change)="onImageSelected($event)"
        style="display: none;" />

      <button type="button" class="avatar-action change-btn" (click)="triggerFileInput()" title="Cambiar foto">
        <span class="material-symbols-outlined">photo_camera</span>
      </button>

      <!-- Delete button only shown when there is an existing image to remove -->
      @if (finalSrc) {
        <button type="button" class="avatar-action delete-btn" (click)="deleteImage()" title="Eliminar foto">
          <span class="material-symbols-outlined">delete</span>
        </button>
      }
    </div>
  }
</div>

<!-- Full-size preview modal: shown only in read-only mode (not editable) when there is an image and showModal() is true -->
@if (showModal() && finalSrc && !editable) {
  <div
    class="avatar-modal-overlay"
    (click)="closeModal()"
    (keydown)="onKeyDown($event)"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title">
    <div class="avatar-modal" (click)="$event.stopPropagation()">
      <button type="button" class="modal-close" (click)="closeModal()" title="Cerrar">
        <span class="material-symbols-outlined">close</span>
      </button>

      <img [src]="finalSrc" [alt]="'Foto de ' + displayName" class="modal-image" />

      <p class="modal-name" id="modal-title">{{ displayName }}</p>
    </div>
  </div>
}

<!-- Confirmation dialog shown before deleting the profile picture; visibility bound to showDeleteConfirm() -->
<app-modal-confirm
  [isOpen]="showDeleteConfirm()"
  title="Eliminar foto de perfil"
  message="¿Estás seguro de que deseas eliminar tu foto de perfil? El cambio se aplicará cuando pulses Guardar Cambios."
  confirmText="Eliminar"
  cancelText="Cancelar"
  variant="danger"
  (confirmed)="confirmDeleteImage()"
  (cancelled)="cancelDeleteImage()">
</app-modal-confirm>
