<!-- Entire control is hidden when there is only one page (totalPages input) -->
@if(totalPages > 1){

<nav class="pagination">

    <!-- Previous page button, disabled when already on the first page -->
    <button
        class="btn-page"
        [disabled]="currentPage === 1"
        (click)="previous()">
        ←
    </button>

    <!-- One button per page number, generated from the "pages" getter (derived from totalPages) -->
    @for(page of pages; track page){
    <button
        class="btn-page"
        [class.active]="page === currentPage"
        (click)="goTo(page)">
        {{ page }}
    </button>
    }

    <!-- Next page button, disabled when already on the last page -->
    <button
        class="btn-page"
        [disabled]="currentPage === totalPages"
        (click)="next()">
        →
    </button>
</nav>

}
