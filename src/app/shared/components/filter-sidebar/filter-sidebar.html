<aside class="filter-sidebar card-toybox">
  <div class="filter-sidebar__header">
    <span class="material-symbols-outlined">tune</span>
    <h2>Filtros</h2>
  </div>

  <p class="filter-sidebar__required-note">
    <span>*</span> Campos obligatorios
  </p>

  <form
    class="filter-sidebar__form"
    #filterForm
    (submit)="$event.preventDefault(); onApplyFilters(category.value, price.value, location.value, status.value)"
  >
    <div class="filter-group">
      <label for="filter-category">
        Categoría <span class="required-star">*</span>
      </label>

      <select
        id="filter-category"
        class="form-control"
        #category
        [value]="selectedCategoryId"
      >
        <option value="0">Selecciona una categoría</option>

        @for (categoryItem of categories; track categoryItem.id_categories) {
          @if (categoryItem.id_categories !== 0) {
            <option [value]="categoryItem.id_categories">
              {{ categoryItem.name }}
            </option>
          }
        }
      </select>
    </div>

    <div class="filter-group">
      <label for="filter-price">
        Precio máximo <span class="required-star">*</span>
      </label>

      <input
        id="filter-price"
        class="form-control"
        type="number"
        min="1"
        placeholder="Ej. 30 €"
        #price
      />
    </div>

    <div class="filter-group">
      <label for="filter-location">
        Ubicación <span class="required-star">*</span>
      </label>

      <input
        id="filter-location"
        class="form-control"
        type="text"
        placeholder="Ciudad o provincia"
        #location
      />
    </div>

    <div class="filter-group">
      <label for="filter-status">
        Estado <span class="required-star">*</span>
      </label>

      <select id="filter-status" class="form-control" #status>
        <option value="">Selecciona estado</option>

        @for (state of productStates; track state.value) {
          <option [value]="state.value">{{ state.label }}</option>
        }
      </select>
    </div>

    @if (errorMessage) {
      <p class="filter-sidebar__error">
        {{ errorMessage }}
      </p>
    }

    <div class="filter-sidebar__actions">
      <button class="btn-toybox-secondary" type="submit">
        Aplicar filtros
      </button>

      <button
        class="filter-sidebar__clear"
        type="reset"
        (click)="onClearFilters()"
      >
        Limpiar filtros
      </button>
    </div>
  </form>
</aside>
