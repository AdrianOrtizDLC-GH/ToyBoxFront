<aside class="filter-sidebar card-toybox">
  <div class="filter-sidebar__header">
    <span class="material-symbols-outlined">tune</span>
    <h2>Filtros</h2>
  </div>

  <!-- Filter form: on submit, reads template-referenced field values and calls onApplyFilters(), which emits filtersApplied -->
  <form class="filter-sidebar__form"
    (submit)="$event.preventDefault(); onApplyFilters(category.value, price.value, location.value, status.value)">
    <div class="filter-group">
      <label for="filter-category">Categoría</label>
      <!-- Category dropdown, populated from the categories @Input; pre-selected using selectedCategoryId @Input -->
      <select id="filter-category" class="form-control" #category [value]="selectedCategoryId">
        <option value="0">Todas las categorías</option>
        @for (categoryItem of categories; track categoryItem.id_categories) {
        @if (categoryItem.id_categories !== 0) {
        <option [value]="categoryItem.id_categories">
          {{ categoryItem.name }}
        </option>
        }
        }
      </select>
    </div>

    <div class="filter-group">
      <label for="filter-price">Precio máximo</label>
      <input id="filter-price" class="form-control" type="number" min="1" placeholder="Ej. 30 €" #price />
    </div>

    <div class="filter-group">
      <label for="filter-location">Ubicación</label>
      <!-- Location dropdown, populated from the component's static `locations` list -->
      <select id="filter-location" class="form-control" #location>
        <option value="">Cualquier lugar</option>
        @for (loc of locations; track loc.value) {
        <option [value]="loc.value">{{ loc.label }}</option>
        }
      </select>
    </div>

    <div class="filter-group">
      <label for="filter-status">Estado</label>
      <!-- Conservation status dropdown, populated from the component's static `productStates` list -->
      <select id="filter-status" class="form-control" #status>
        <option value="">Cualquier estado</option>
        @for (state of productStates; track state.value) {
        <option [value]="state.value">{{ state.label }}</option>
        }
      </select>
    </div>

    <!-- Action buttons: submit applies filters, reset button clears them via onClearFilters() -->
    <div class="filter-sidebar__actions">
      <button class="btn-toybox-secondary" type="submit">
        Aplicar filtros
      </button>
      <button class="filter-sidebar__clear" type="reset" (click)="onClearFilters()">
        Limpiar filtros
      </button>
    </div>
  </form>
</aside>
