<!-- Empty-state placeholder: icon, title, and message are all driven by @Input properties -->
<div class="empty-state">

    <div class="empty-icon">
        {{ icon }}
    </div>
    <h2>{{ title }}</h2>
    <p class="text-on-surface-variant">
        {{ message }}
    </p>
    <!-- Optional call-to-action button, only rendered when buttonText @Input is non-empty -->
    @if(buttonText){
    <a
        [routerLink]="buttonLink"
        class="btn-toybox-primary empty-button">
        {{ buttonText }}
    </a>
    }

</div>
