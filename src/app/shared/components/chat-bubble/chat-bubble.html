<!-- Bubble container; styled left/right and colored differently depending on the isOwn @Input -->
<div
  class="tb-bubble"
  [class.tb-bubble--own]="isOwn"
  [class.tb-bubble--other]="!isOwn"
>

  <!-- Sender avatar, only shown for messages from other users (see shouldShowAvatar getter) -->
  @if (shouldShowAvatar) {

    <app-user-avatar
      [src]="displaySenderAvatar"
      [name]="message.senderName"
      size="small"
      [attr.aria-label]="'Avatar de ' + message.senderName">
    </app-user-avatar>
  }

  <div class="tb-bubble__content">

    <!-- Message text content, driven by the message @Input -->
    <div class="tb-bubble__text">
      {{ message.content }}
    </div>

    <div class="tb-bubble__meta">
      <!-- Timestamp of when the message was sent -->
      <time
        class="tb-bubble__time"
        [attr.datetime]="message.sent_date"
      >
        {{ message.sent_date | date:'HH:mm' }}
      </time>

      <!-- Read/sent status icon, only rendered for the current user's own messages -->
      @if (isOwn) {
        <span
          class="material-symbols-outlined tb-bubble__status"
          [class.tb-bubble__status--read]="message.read"
          [attr.aria-label]="getReadStatusLabel()"
        >
          {{ message.read ? 'done_all' : 'done' }}
        </span>
      }
    </div>

  </div>

</div>
